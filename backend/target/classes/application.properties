spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/swayamPay
spring.datasource.username=root
spring.datasource.password=tarun2244@#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8082
server.servlet.context-path=/api

# Logging
logging.level.com.swayampay=DEBUG

# JWT Configuration
jwt.secret=your-secret-key-here-make-it-very-long-and-secure-for-production
jwt.expiration=86400000

# PayPal Configuration
paypal.client.id=your-paypal-client-id
paypal.client.secret=your-paypal-client-secret
paypal.mode=sandbox



